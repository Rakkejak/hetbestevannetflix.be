name: Weekly Netflix Belgium update

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * 0"

permissions:
  contents: write

concurrency:
  group: netflix-belgium-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check TMDb configuration
        run: |
          python - <<'PY'
          import os
          if not os.getenv("TMDB_API_KEY"):
              raise SystemExit("TMDB_API_KEY ontbreekt.")
          print("TMDB_API_KEY is ingesteld.")
          PY

      - name: Update Netflix Belgium data
        run: python -u update_all.py

      - name: Enrich titles with genres
        run: python -u enrich_genres.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          checks = {
              "netflix_data.json": 100,
              "netflix_last_month.json": 0,
          }

          for name, minimum in checks.items():
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"{name} ontbreekt.")

              data = json.loads(path.read_text(encoding="utf-8"))

              if not isinstance(data, list):
                  raise SystemExit(f"{name} is geen lijst.")

              if len(data) < minimum:
                  raise SystemExit(
                      f"{name} bevat slechts {len(data)} items; minimum is {minimum}."
                  )

              print(f"{name}: {len(data)} items")

          print("Datavalidatie geslaagd.")
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            netflix_data.json \
            netflix_last_month.json \
            netflix_be_state.json \
            tmdb_imdb_cache.json \
            netflix_id_cache.json \
            tmdb_genre_cache.json

          if ! git diff --cached --quiet; then
            git commit -m "Weekly Netflix Belgium update [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Geen wijzigingen om te committen."
          fi
